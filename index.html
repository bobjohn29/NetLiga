<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Liga</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#d90000;--dark:#111;--bg:#f5f5f5}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--dark);overflow-x:hidden}
.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px;overflow:hidden}

/* SPLASH */
.splash{
position:fixed;inset:0;background:radial-gradient(circle,#ff2a2a,#d90000 55%,#880000);
z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;
transition:opacity .65s ease,transform .65s ease,visibility .65s ease
}
.splash.hide{opacity:0;transform:translateY(-100%);visibility:hidden;pointer-events:none}
.splash::before{
content:"";position:absolute;width:180%;height:180%;
background:conic-gradient(transparent,rgba(255,255,255,.28),transparent);
animation:spin 2.5s linear infinite
}
.splash::after{
content:"";position:absolute;inset:0;
background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.25) 50%,transparent 80%);
animation:splashShine 1.5s ease-in-out infinite
}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
.splash img{
width:230px;border-radius:28px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));
animation:logoIntro .8s cubic-bezier(.2,1.4,.4,1),float 1.8s ease-in-out infinite .8s
}
.loader{width:150px;height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.loader span{display:block;height:100%;width:45%;border-radius:999px;background:#fff;animation:loadMove 1.1s ease-in-out infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splashShine{0%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes logoIntro{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes loadMove{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}

/* HERO */
.hero{
height:230px;background:var(--red);position:relative;overflow:hidden;
display:flex;align-items:center;justify-content:center
}
.hero img{width:100%;height:100%;object-fit:cover;animation:heroZoom 8s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.38))}
.hero::before{
content:"";position:absolute;inset:0;z-index:2;
background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 50%,transparent 75%);
animation:shine 3.5s ease-in-out infinite
}
.hero-title{position:absolute;bottom:24px;left:22px;color:white;z-index:3;animation:slideUp .65s ease both}
.hero-title h1{font-size:34px;font-weight:1000}
.hero-title p{font-size:14px;font-weight:700;opacity:.9}

@keyframes heroZoom{from{transform:scale(1.03)}to{transform:scale(1.12)}}
@keyframes shine{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* CLUBS */
.clubs{padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.club{
background:#fff;border:0;border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;
box-shadow:0 8px 24px rgba(0,0,0,.08);position:relative;overflow:hidden;
transition:transform .22s ease,box-shadow .22s ease;animation:cardIn .45s ease both
}
.club:nth-child(1){animation-delay:.08s}
.club:nth-child(2){animation-delay:.16s}
.club:nth-child(3){animation-delay:.24s}
.club::after{
content:"";position:absolute;inset:0;
background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.9) 45%,transparent 70%);
transform:translateX(-130%);transition:transform .55s ease
}
.club:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 14px 30px rgba(217,0,0,.18)}
.club:hover::after{transform:translateX(130%)}
.club:active{transform:scale(.96)}
.club img{width:58px;height:58px;border-radius:50%;object-fit:cover;transition:.25s ease}
.club:hover img{transform:rotate(-4deg) scale(1.08)}
.club b{display:block;margin-top:10px;font-size:13px}

@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* PAGES */
.page{display:none;padding:0 18px 18px}
.page.active{display:block;animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.title{font-size:24px;font-weight:1000;margin:8px 0 16px}
.card{
background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.08);
overflow:hidden;margin-bottom:18px;transition:.22s ease
}
.card:hover{box-shadow:0 14px 34px rgba(217,0,0,.12);transform:translateY(-2px)}

.empty-games{
height:150px;display:flex;align-items:center;justify-content:center;
color:#999;font-size:17px;font-weight:800;position:relative
}
.empty-games::after{
content:"";position:absolute;width:80px;height:80px;border-radius:50%;
border:2px dashed rgba(217,0,0,.22);animation:pulse 1.7s ease-in-out infinite
}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.35}50%{transform:scale(1.12);opacity:.75}}

/* TABLE */
.table-head,.row{display:grid;grid-template-columns:34px 1fr 38px 34px 34px 44px 48px;align-items:center}
.table-head{height:48px;background:#f3f3f3;color:#777;font-weight:900;font-size:12px}
.row{
height:56px;border-top:1px solid #eee;font-size:13px;transition:.2s ease;
position:relative;overflow:hidden
}
.row::after{
content:"";position:absolute;inset:0;
background:linear-gradient(90deg,transparent,rgba(217,0,0,.08),transparent);
transform:translateX(-130%);transition:.5s ease
}
.row:hover{background:#fff5f5}
.row:hover::after{transform:translateX(130%)}
.rank{text-align:center;font-weight:1000}
.points{font-weight:1000;text-align:center;color:var(--red)}
.center{text-align:center}

/* NAV */
.nav{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);
width:100%;max-width:430px;height:80px;background:rgba(255,255,255,.94);
backdrop-filter:blur(18px);border-top:1px solid #ddd;
display:flex;justify-content:center;align-items:center;gap:18px;z-index:100
}
.nav button{
border:0;border-radius:18px;padding:16px 28px;background:#eee;color:#777;
font-weight:1000;font-size:15px;cursor:pointer;position:relative;overflow:hidden;
transition:transform .2s ease,box-shadow .2s ease,background .2s ease,color .2s ease
}
.nav button::after{
content:"";position:absolute;inset:0;
background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.75) 45%,transparent 70%);
transform:translateX(-130%);transition:.45s ease
}
.nav button:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.12)}
.nav button:hover::after{transform:translateX(130%)}
.nav button:active{transform:scale(.94)}
.nav button.active{background:linear-gradient(135deg,#ff2424,#d90000);color:white;box-shadow:0 10px 24px rgba(217,0,0,.32)}

/* CLUB MODAL */
.club-screen{
position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.42);
backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center
}
.club-screen.show{display:flex;animation:fadeIn .25s ease both}
.club-panel{
width:100%;max-width:430px;background:#fff;border-radius:32px 32px 0 0;
padding:22px 22px 110px;position:relative;overflow:hidden;animation:panelUp .38s cubic-bezier(.2,1.15,.3,1) both
}
.club-panel::before{
content:"";position:absolute;top:0;left:0;right:0;height:140px;
background:radial-gradient(circle at top,#ff2b2b,#d90000 60%,#a80000);z-index:0
}
.club-panel::after{
content:"";position:absolute;top:0;left:-80%;width:60%;height:140px;
background:linear-gradient(110deg,transparent,rgba(255,255,255,.45),transparent);
animation:panelShine 1.7s ease-in-out infinite
}
.club-close{
position:absolute;right:18px;top:18px;z-index:3;border:0;background:rgba(255,255,255,.24);
color:white;width:38px;height:38px;border-radius:50%;font-size:24px;font-weight:900;
cursor:pointer;transition:.2s ease
}
.club-close:hover{transform:rotate(90deg) scale(1.06)}
.club-top{position:relative;z-index:2;display:flex;align-items:center;gap:16px;color:white;margin-top:30px}
.club-top img{
width:86px;height:86px;border-radius:50%;object-fit:cover;border:5px solid white;
box-shadow:0 14px 25px rgba(0,0,0,.25);animation:infoLogo .42s ease both
}
.club-top h2{font-size:28px;font-weight:1000}
.club-top p{font-size:14px;font-weight:800;opacity:.9;margin-top:3px}
.info-loading{height:4px;background:rgba(217,0,0,.13);border-radius:999px;margin:34px 0 18px;overflow:hidden;position:relative;z-index:2}
.info-loading span{display:block;width:55%;height:100%;background:var(--red);border-radius:999px;animation:infoLoad .75s ease both}
.stats-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{
background:#fff;border-radius:18px;padding:16px 8px;text-align:center;
box-shadow:0 8px 24px rgba(0,0,0,.08);animation:statIn .35s ease both
}
.stat b{display:block;font-size:24px;color:var(--red)}
.stat span{font-size:11px;font-weight:900;color:#888}
.players-card{
position:relative;z-index:2;background:#fff;border-radius:22px;padding:18px;
box-shadow:0 8px 24px rgba(0,0,0,.08);animation:pageIn .35s ease both
}
.players-card h3{font-size:18px;margin-bottom:12px}
.player-list{display:flex;flex-wrap:wrap;gap:10px}
.player-pill{
background:#fff1f1;color:var(--red);padding:11px 14px;border-radius:999px;font-weight:1000;
animation:pillPop .28s ease both
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes panelShine{0%{transform:translateX(0)}55%,100%{transform:translateX(320%)}}
@keyframes infoLogo{from{transform:scale(.65) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes infoLoad{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes statIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pillPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>

<div class="splash" id="splash">
  <div class="splash-inner">
    <img src="logo.png">
    <div class="loader"><span></span></div>
  </div>
</div>

<div class="app">

  <div class="hero">
    <img src="hero.png">
    <div class="hero-title">
      <h1>Liga</h1>
      <p>Badminton League</p>
    </div>
  </div>

  <div class="clubs">
    <button class="club" data-club="0"><img src="logo.png"><b>Template 1</b></button>
    <button class="club" data-club="1"><img src="logo.png"><b>Template 2</b></button>
    <button class="club" data-club="2"><img src="logo.png"><b>Template 3</b></button>
  </div>

  <section id="spiele" class="page active">
    <h2 class="title">Spiele</h2>
    <div class="card empty-games">Keine Spiele bisher…</div>
  </section>

  <section id="tabelle" class="page">
    <h2 class="title">Tabelle</h2>

    <div class="card">
      <div class="table-head">
        <div>#</div><div>Club</div><div>MP</div><div>W</div><div>L</div><div>SD</div><div>PTS</div>
      </div>

      <div class="row"><div class="rank">1</div><div>Template 1</div><div class="center">0</div><div class="center">0</div><div class="center">0</div><div class="center">0</div><div class="points">0</div></div>
      <div class="row"><div class="rank">2</div><div>Template 2</div><div class="center">0</div><div class="center">0</div><div class="center">0</div><div class="center">0</div><div class="points">0</div></div>
      <div class="row"><div class="rank">3</div><div>Template 3</div><div class="center">0</div><div class="center">0</div><div class="center">0</div><div class="center">0</div><div class="points">0</div></div>
    </div>
  </section>

</div>

<nav class="nav">
  <button class="active" data-page="spiele">Spiele</button>
  <button data-page="tabelle">Tabelle</button>
</nav>

<div class="club-screen" id="clubScreen">
  <div class="club-panel" id="clubPanel">
    <button class="club-close" id="clubClose">×</button>

    <div class="club-top">
      <img src="logo.png">
      <div>
        <h2 id="infoName">Template 1</h2>
        <p>Club Info & Stats</p>
      </div>
    </div>

    <div class="info-loading"><span></span></div>

    <div class="stats-grid">
      <div class="stat"><b id="statMP">0</b><span>MP</span></div>
      <div class="stat"><b id="statW">0</b><span>WINS</span></div>
      <div class="stat"><b id="statPTS">0</b><span>PTS</span></div>
    </div>

    <div class="players-card">
      <h3>Players</h3>
      <div class="player-list" id="playerList"></div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const splash=document.getElementById("splash");

  setTimeout(()=>{
    splash.classList.add("hide");
  },2100);

  const navButtons=document.querySelectorAll(".nav button");
  const pages=document.querySelectorAll(".page");

  navButtons.forEach(btn=>{
    btn.addEventListener("click",()=>{
      const page=btn.dataset.page;

      navButtons.forEach(b=>b.classList.remove("active"));
      pages.forEach(p=>p.classList.remove("active"));

      btn.classList.add("active");
      document.getElementById(page).classList.add("active");

      window.scrollTo({top:0,behavior:"smooth"});
    });
  });

  const clubData=[
    {name:"Template 1",players:["Lukas"],mp:0,w:0,pts:0},
    {name:"Template 2",players:["Yannik"],mp:0,w:0,pts:0},
    {name:"Template 3",players:["Lea","Lina","Nele"],mp:0,w:0,pts:0}
  ];

  const clubScreen=document.getElementById("clubScreen");
  const clubPanel=document.getElementById("clubPanel");
  const clubClose=document.getElementById("clubClose");
  const infoName=document.getElementById("infoName");
  const statMP=document.getElementById("statMP");
  const statW=document.getElementById("statW");
  const statPTS=document.getElementById("statPTS");
  const playerList=document.getElementById("playerList");

  function restartAnimations(){
    clubPanel.style.animation="none";
    clubPanel.offsetHeight;
    clubPanel.style.animation="";

    clubPanel.querySelectorAll(".stat,.player-pill,.info-loading span,.club-top img").forEach(el=>{
      el.style.animation="none";
      el.offsetHeight;
      el.style.animation="";
    });
  }

  document.querySelectorAll(".club").forEach(card=>{
    card.addEventListener("click",()=>{
      const data=clubData[Number(card.dataset.club)];

      infoName.textContent=data.name;
      statMP.textContent=data.mp;
      statW.textContent=data.w;
      statPTS.textContent=data.pts;

      playerList.innerHTML=data.players.map((p,i)=>
        `<span class="player-pill" style="animation-delay:${i*.08}s">${p}</span>`
      ).join("");

      clubScreen.classList.add("show");
      restartAnimations();
    });
  });

  function closeClub(){
    clubScreen.classList.remove("show");
  }

  clubClose.addEventListener("click",closeClub);

  clubScreen.addEventListener("click",e=>{
    if(e.target===clubScreen) closeClub();
  });

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeClub();
  });
});
</script>

</body>
</html>
