<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Liga</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
--red:#d90000;
--dark:#111;
--bg:#f5f5f5;
--green:#20a84a;
}

html,body{touch-action:manipulation;overscroll-behavior:none}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);
color:var(--dark);
overflow-x:hidden;
user-select:none;
}

.app{max-width:430px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px;overflow:hidden}

.splash{position:fixed;inset:0;background:radial-gradient(circle,#ff2a2a,#d90000 55%,#880000);z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:.65s ease}
.splash.hide{opacity:0;transform:translateY(-100%);visibility:hidden;pointer-events:none}
.splash::before{content:"";position:absolute;width:180%;height:180%;background:conic-gradient(transparent,rgba(255,255,255,.28),transparent);animation:spin 2.5s linear infinite}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.25) 50%,transparent 80%);animation:splashShine 1.5s ease-in-out infinite}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
.splash img{width:230px;border-radius:28px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));animation:logoIntro .8s cubic-bezier(.2,1.4,.4,1),float 1.8s ease-in-out infinite .8s}
.loader{width:150px;height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.loader span{display:block;height:100%;width:45%;border-radius:999px;background:#fff;animation:loadMove 1.1s ease-in-out infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splashShine{0%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes logoIntro{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes loadMove{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}

.hero{height:230px;background:var(--red);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;height:100%;object-fit:cover;animation:heroZoom 8s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.38))}
.hero::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 50%,transparent 75%);animation:shine 3.5s ease-in-out infinite}
.hero-title{position:absolute;bottom:24px;left:22px;color:white;z-index:3;animation:slideUp .65s ease both}
.hero-title h1{font-size:34px;font-weight:1000}
.hero-title p{font-size:14px;font-weight:700;opacity:.9}

@keyframes heroZoom{from{transform:scale(1.03)}to{transform:scale(1.12)}}
@keyframes shine{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

.clubs{padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.club{background:#fff;border:0;border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.08);position:relative;overflow:hidden;transition:.22s ease;animation:cardIn .45s ease both}
.club::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.9) 45%,transparent 70%);transform:translateX(-130%);transition:.55s ease}
.club:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 14px 30px rgba(217,0,0,.18)}
.club:hover::after{transform:translateX(130%)}
.club img{width:58px;height:58px;border-radius:50%;object-fit:cover}
.club b{display:block;margin-top:10px;font-size:13px}

@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.page{display:none;padding:0 18px 18px}
.page.active{display:block;animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.title{font-size:24px;font-weight:1000;margin:8px 0 16px;display:flex;align-items:center;gap:10px}
.title img{width:34px;height:34px;border-radius:9px;background:var(--red);object-fit:cover;box-shadow:0 6px 16px rgba(217,0,0,.25)}

.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden;margin-bottom:18px;transition:.22s ease}

.game-row{
height:74px;
display:grid;
grid-template-columns:1fr 92px 1fr;
align-items:center;
border-top:1px solid #eee;
}

.game-row:first-child{border-top:0}

.game-team{
display:flex;
align-items:center;
justify-content:center;
height:100%;
}

.game-team img{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.game-score{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
font-size:23px;
font-weight:1000;
}

.score-win{color:var(--green)}
.score-lose{color:var(--red)}
.score-draw{color:#777}

.table-head,.row{display:grid;grid-template-columns:34px 1fr 38px 34px 34px 44px 48px;align-items:center}
.table-head{height:48px;background:#f3f3f3;color:#777;font-weight:900;font-size:12px}
.row{height:56px;border-top:1px solid #eee;font-size:13px;position:relative;overflow:hidden}
.rank{text-align:center;font-weight:1000;display:flex;align-items:center;justify-content:center;gap:3px}
.points{font-weight:1000;text-align:center;color:var(--red)}
.center{text-align:center}
.arrow-up{color:var(--green);font-size:12px;font-weight:1000}
.arrow-down{color:var(--red);font-size:12px;font-weight:1000}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:80px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid #ddd;display:flex;justify-content:center;align-items:center;gap:18px;z-index:100}
.nav button{border:0;border-radius:18px;padding:16px 28px;background:#eee;color:#777;font-weight:1000;font-size:15px;cursor:pointer;transition:.2s ease}
.nav button.active{background:linear-gradient(135deg,#ff2424,#d90000);color:white;box-shadow:0 10px 24px rgba(217,0,0,.32)}

.club-screen{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center}
.club-screen.show{display:flex;animation:fadeIn .25s ease both}
.club-panel{width:100%;max-width:430px;background:#fff;border-radius:32px 32px 0 0;padding:22px 22px 110px;position:relative;overflow:hidden;animation:panelUp .38s cubic-bezier(.2,1.15,.3,1) both}
.club-panel::before{content:"";position:absolute;top:0;left:0;right:0;height:140px;background:radial-gradient(circle at top,#ff2b2b,#d90000 60%,#a80000);z-index:0}
.club-close{position:absolute;right:18px;top:18px;z-index:3;border:0;background:rgba(255,255,255,.24);color:white;width:38px;height:38px;border-radius:50%;font-size:24px;font-weight:900;cursor:pointer}
.club-top{position:relative;z-index:2;display:flex;align-items:center;gap:16px;color:white;margin-top:30px}
.club-top img{width:86px;height:86px;border-radius:50%;object-fit:cover;border:5px solid white}
.club-top h2{font-size:28px;font-weight:1000}
.stats-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:30px 0 18px}
.stat{background:#fff;border-radius:18px;padding:16px 8px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.stat b{display:block;font-size:24px;color:var(--red)}
.stat span{font-size:11px;font-weight:900;color:#888}
.players-card{position:relative;z-index:2;background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.players-card h3{font-size:18px;margin-bottom:12px}
.player-list{display:flex;flex-wrap:wrap;gap:10px}
.player-pill{background:#fff1f1;color:var(--red);padding:11px 14px;border-radius:999px;font-weight:1000;border:0;cursor:pointer}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelUp{from{transform:translateY(105%)}to{transform:translateY(0)}}
</style>
</head>

<body>

<div class="splash" id="splash">
<div class="splash-inner">
<img src="387BA24B-22D1-4ECD-8C65-ACD95250A07F.png">
<div class="loader"><span></span></div>
</div>
</div>

<div class="app">

<div class="hero">
<img src="IMG_4389.png">
<div class="hero-title">
<h1>Liga</h1>
<p>Badminton League</p>
</div>
</div>

<div class="clubs" id="clubs"></div>

<section id="spiele" class="page active">
<h2 class="title">
Spiele
<img src="IMG_4390.png">
</h2>

<div class="card" id="gamesList"></div>
</section>

<section id="tabelle" class="page">
<h2 class="title">
Tabelle
<img src="IMG_4390.png">
</h2>

<div class="card">
<div class="table-head">
<div>#</div>
<div>Club</div>
<div>MP</div>
<div>W</div>
<div>L</div>
<div>SD</div>
<div>PTS</div>
</div>

<div id="tableRows"></div>
</div>
</section>

</div>

<nav class="nav">
<button class="active" data-page="spiele">Spiele</button>
<button data-page="tabelle">Tabelle</button>
</nav>

<div class="club-screen" id="clubScreen">
<div class="club-panel">

<button class="club-close" id="clubClose">×</button>

<div class="club-top">
<img src="46C660E7-02E7-4BB3-A28C-643FEF385BCF.png" id="infoImage">
<div>
<h2 id="infoName">Warminster Strikers</h2>
<p>Club Info & Stats</p>
</div>
</div>

<div class="stats-grid">
<div class="stat"><b id="statMP">0</b><span>MP</span></div>
<div class="stat"><b id="statW">0</b><span>WINS</span></div>
<div class="stat"><b id="statPTS">0</b><span>PTS</span></div>
</div>

<div class="players-card">
<h3>Players</h3>
<div class="player-list" id="playerList"></div>
</div>

</div>
</div>

<div class="club-screen" id="playerScreen">
<div class="club-panel">

<button class="club-close" id="playerClose">×</button>

<div class="club-top">
<img src="lukas.png" id="playerImage">
<div>
<h2 id="playerName">Lukas</h2>
<p>Player Profile</p>
</div>
</div>

<div class="stats-grid">
<div class="stat"><b id="playerPoints">0</b><span>POINTS</span></div>
<div class="stat"><b id="playerClub">-</b><span>CLUB</span></div>
<div class="stat"><b id="playerMatches">0</b><span>MP</span></div>
</div>

</div>
</div>

<script>
const clubsData=[
{
key:"warminster",
name:"Warminster Strikers",
image:"46C660E7-02E7-4BB3-A28C-643FEF385BCF.png",
players:[
{name:"Lukas",image:"lukas.png",points:0,matches:0}
],
stats:{mp:6,w:3,l:2,sd:7,pts:10},
arrowUp:true,
arrowDown:false
},
{
key:"template",
name:"Solo Smash",
image:"DDEEC6E9-8E6E-4C1D-B685-8DA949AF550B.png",
players:[
{name:"Yannik",image:"yannik.png",points:0,matches:0}
],
stats:{mp:6,w:5,l:0,sd:34,pts:16},
arrowUp:true,
arrowDown:false
},
{
key:"peanut",
name:"FC Peanut",
image:"9B106E7E-B60A-4BA9-B6D9-8C884648C435.png",
players:[
{name:"Lea",image:"lea.png",points:0,matches:0},
{name:"Lina",image:"lina.png",points:0,matches:0},
{name:"Nele",image:"nele.png",points:0,matches:0}
],
stats:{mp:6,w:0,l:6,sd:-41,pts:0},
arrowUp:false,
arrowDown:true
}
];

/* ==============================
   EASY GAMES SECTION
   Edit only scoreA and scoreB.
   null = not played yet.
============================== */

const gamesData=[
{teamA:"warminster",teamB:"peanut",scoreA:14,scoreB:10},
{teamA:"template",teamB:"peanut",scoreA:16,scoreB:10},
{teamA:"template",teamB:"warminster",scoreA:15,scoreB:8},
{teamA:"warminster",teamB:"peanut",scoreA:15,scoreB:9},
{teamA:"template",teamB:"peanut",scoreA:18,scoreB:14},
{teamA:"template",teamB:"warminster",scoreA:12,scoreB:12},
{teamA:"warminster",teamB:"peanut",scoreA:11,scoreB:6},
{teamA:"template",teamB:"peanut",scoreA:20,scoreB:4},
{teamA:"template",teamB:"warminster",scoreA:19,scoreB:18},
{teamA:"warminster",teamB:"peanut",scoreA:null,scoreB:null},
{teamA:"peanut",teamB:"template",scoreA:null,scoreB:null},
{teamA:"template",teamB:"warminster",scoreA:null,scoreB:null},
{teamA:"peanut",teamB:"warminster",scoreA:null,scoreB:null},
{teamA:"template",teamB:"peanut",scoreA:null,scoreB:null},
{teamA:"warminster",teamB:"template",scoreA:null,scoreB:null}
];

document.addEventListener("DOMContentLoaded",()=>{

setTimeout(()=>{
document.getElementById("splash").classList.add("hide");
},2100);

const clubsContainer=document.getElementById("clubs");
const tableRows=document.getElementById("tableRows");
const gamesList=document.getElementById("gamesList");

function getClub(key){
return clubsData.find(club=>club.key===key);
}

clubsContainer.innerHTML=clubsData.map((club,index)=>`
<button class="club" data-club="${index}">
<img src="${club.image}">
<b>${club.name}</b>
</button>
`).join("");

gamesList.innerHTML=gamesData.map(game=>{
const a=getClub(game.teamA);
const b=getClub(game.teamB);

let scoreClassA="score-draw";
let scoreClassB="score-draw";

if(game.scoreA!==null && game.scoreB!==null){
if(game.scoreA>game.scoreB){
scoreClassA="score-win";
scoreClassB="score-lose";
}else if(game.scoreB>game.scoreA){
scoreClassA="score-lose";
scoreClassB="score-win";
}
}

return `
<div class="game-row">
<div class="game-team">
<img src="${a.image}" alt="${a.name}">
</div>

<div class="game-score">
<span class="${scoreClassA}">${game.scoreA===null ? "-" : game.scoreA}</span>
<span>:</span>
<span class="${scoreClassB}">${game.scoreB===null ? "-" : game.scoreB}</span>
</div>

<div class="game-team">
<img src="${b.image}" alt="${b.name}">
</div>
</div>
`;
}).join("");

const sortedClubs=[...clubsData].sort((a,b)=>
b.stats.pts-a.stats.pts || b.stats.sd-a.stats.sd
);

tableRows.innerHTML=sortedClubs.map((club,index)=>{

const arrow=club.arrowUp
? `<span class="arrow-up">▲</span>`
: club.arrowDown
? `<span class="arrow-down">▼</span>`
: "";

return `
<div class="row">
<div class="rank">${index+1}${arrow}</div>
<div>${club.name}</div>
<div class="center">${club.stats.mp}</div>
<div class="center">${club.stats.w}</div>
<div class="center">${club.stats.l}</div>
<div class="center">${club.stats.sd}</div>
<div class="points">${club.stats.pts}</div>
</div>
`;

}).join("");

document.querySelectorAll(".nav button").forEach(btn=>{
btn.addEventListener("click",()=>{
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
btn.classList.add("active");
document.getElementById(btn.dataset.page).classList.add("active");
});
});

const clubScreen=document.getElementById("clubScreen");
const clubClose=document.getElementById("clubClose");

const infoName=document.getElementById("infoName");
const infoImage=document.getElementById("infoImage");
const statMP=document.getElementById("statMP");
const statW=document.getElementById("statW");
const statPTS=document.getElementById("statPTS");
const playerList=document.getElementById("playerList");

const playerScreen=document.getElementById("playerScreen");
const playerClose=document.getElementById("playerClose");
const playerImage=document.getElementById("playerImage");
const playerName=document.getElementById("playerName");
const playerPoints=document.getElementById("playerPoints");
const playerClub=document.getElementById("playerClub");
const playerMatches=document.getElementById("playerMatches");

function openPlayer(player,club){
playerName.textContent=player.name;
playerImage.src=player.image;
playerPoints.textContent=player.points;
playerClub.textContent=club.name;
playerMatches.textContent=player.matches;
playerScreen.classList.add("show");
}

document.querySelectorAll(".club").forEach(card=>{

card.addEventListener("click",()=>{

const data=clubsData[Number(card.dataset.club)];

infoName.textContent=data.name;
infoImage.src=data.image;

statMP.textContent=data.stats.mp;
statW.textContent=data.stats.w;
statPTS.textContent=data.stats.pts;

playerList.innerHTML=data.players.map((player,i)=>`
<button class="player-pill" data-player="${i}">
${player.name}
</button>
`).join("");

playerList.querySelectorAll(".player-pill").forEach(btn=>{

btn.addEventListener("click",()=>{
openPlayer(data.players[Number(btn.dataset.player)],data);
});

});

clubScreen.classList.add("show");

});

});

clubClose.addEventListener("click",()=>{
clubScreen.classList.remove("show");
});

playerClose.addEventListener("click",()=>{
playerScreen.classList.remove("show");
});

clubScreen.addEventListener("click",e=>{
if(e.target===clubScreen){
clubScreen.classList.remove("show");
}
});

playerScreen.addEventListener("click",e=>{
if(e.target===playerScreen){
playerScreen.classList.remove("show");
}
});

});
</script>

</body>
</html>
